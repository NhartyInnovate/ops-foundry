<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ops Foundry — Interactive Prototype Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .viewport-frame {
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-[#111215] text-gray-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- Master Control Bar -->
  <header class="bg-[#181A20] border-b border-gray-800 px-4 py-3 flex flex-wrap items-center justify-between gap-4 z-50 shrink-0">
    
    <!-- Left: Brand & Direction -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2.5">
        <span class="w-3 h-3 rounded-full bg-[#FF5A1F]"></span>
        <span class="font-bold text-white tracking-tight text-base font-['Manrope']">Ops Foundry</span>
      </div>
      <span class="text-xs px-2.5 py-0.5 rounded-full bg-gray-800 text-gray-300 hidden sm:inline-block">
        Prototype Viewer
      </span>
    </div>

    <!-- Center: Page Selector -->
    <div class="flex items-center gap-2">
      <label for="pageSelect" class="text-xs text-gray-400 hidden md:inline">Viewing:</label>
      <select id="pageSelect" onchange="navigateTo(this.value)" class="bg-gray-900 text-white text-xs rounded-lg px-3 py-1.5 border border-gray-700 focus:outline-none focus:border-[#FF5A1F]">
        <optgroup label="Corporate Website (Commercial)">
          <option value="corporate-home.html" selected>Corporate: Homepage</option>
          <option value="corporate-services.html">Corporate: Services Overview</option>
          <option value="corporate-service-detail.html">Corporate: Service Detail (Get Online / Visible / Customers)</option>
          <option value="corporate-how-we-work.html">Corporate: How We Work (Operating Model)</option>
        </optgroup>
        <optgroup label="Academy Website (Learning)">
          <option value="academy-home.html">Academy: Homepage</option>
          <option value="academy-programmes.html">Academy: Programmes Overview</option>
          <option value="academy-programme-detail.html">Academy: Programme Detail</option>
          <option value="academy-admissions.html">Academy: Admissions Process</option>
          <option value="academy-tuition.html">Academy: Tuition & Scholarships</option>
        </optgroup>
        <optgroup label="Design System">
          <option value="design-system.html">Shared Design System</option>
        </optgroup>
      </select>
    </div>

    <!-- Right: Responsive Viewport Switcher & Standalone Tab -->
    <div class="flex items-center gap-2">
      <div class="bg-gray-900 p-0.5 rounded-lg flex items-center border border-gray-800 text-xs">
        <button onclick="setViewport('full')" id="btn-full" class="px-2.5 py-1 rounded bg-[#FF5A1F] text-white font-medium transition">
          Full Width
        </button>
        <button onclick="setViewport('desktop')" id="btn-desktop" class="px-2.5 py-1 rounded text-gray-400 hover:text-white transition">
          1440px
        </button>
        <button onclick="setViewport('tablet')" id="btn-tablet" class="px-2.5 py-1 rounded text-gray-400 hover:text-white transition">
          768px
        </button>
        <button onclick="setViewport('mobile')" id="btn-mobile" class="px-2.5 py-1 rounded text-gray-400 hover:text-white transition">
          390px
        </button>
      </div>

      <a id="extLink" href="corporate-home.html" target="_blank" class="p-1.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded transition" title="Open active page in standalone new tab">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </a>
    </div>

  </header>

  <!-- Prototype Stage -->
  <div class="flex-1 bg-[#0B0C0E] p-2 sm:p-4 flex items-center justify-center overflow-auto">
    <div id="frameWrapper" class="viewport-frame w-full h-full bg-white rounded-lg shadow-2xl overflow-hidden border border-gray-800 flex flex-col">
      <iframe id="prototypeFrame" src="corporate-home.html" class="w-full h-full border-none"></iframe>
    </div>
  </div>

  <script>
    const frameWrapper = document.getElementById('frameWrapper');
    const prototypeFrame = document.getElementById('prototypeFrame');
    const pageSelect = document.getElementById('pageSelect');
    const extLink = document.getElementById('extLink');

    const buttons = {
      full: document.getElementById('btn-full'),
      desktop: document.getElementById('btn-desktop'),
      tablet: document.getElementById('btn-tablet'),
      mobile: document.getElementById('btn-mobile')
    };

    function navigateTo(url) {
      prototypeFrame.src = url;
      pageSelect.value = url;
      extLink.href = url;
    }

    function setViewport(mode) {
      Object.values(buttons).forEach(b => {
        b.className = 'px-2.5 py-1 rounded text-gray-400 hover:text-white transition';
      });

      if (mode === 'full') {
        frameWrapper.style.width = '100%';
        frameWrapper.style.height = '100%';
        frameWrapper.classList.remove('ring-4', 'ring-gray-800');
        buttons.full.className = 'px-2.5 py-1 rounded bg-[#FF5A1F] text-white font-medium transition';
      } else if (mode === 'desktop') {
        frameWrapper.style.width = '1440px';
        frameWrapper.style.height = '900px';
        frameWrapper.classList.add('ring-4', 'ring-gray-800');
        buttons.desktop.className = 'px-2.5 py-1 rounded bg-[#FF5A1F] text-white font-medium transition';
      } else if (mode === 'tablet') {
        frameWrapper.style.width = '768px';
        frameWrapper.style.height = '1024px';
        frameWrapper.classList.add('ring-4', 'ring-gray-800');
        buttons.tablet.className = 'px-2.5 py-1 rounded bg-[#FF5A1F] text-white font-medium transition';
      } else if (mode === 'mobile') {
        frameWrapper.style.width = '390px';
        frameWrapper.style.height = '844px';
        frameWrapper.classList.add('ring-4', 'ring-gray-800');
        buttons.mobile.className = 'px-2.5 py-1 rounded bg-[#FF5A1F] text-white font-medium transition';
      }
    }
  </script>
</body>
</html>
